name: Bug
description: 버그 신고
labels: ["type: bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 현상
      placeholder: 어떤 문제가 발생했나요?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      value: "1. \n2. \n3. "
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
  - type: input
    id: env
    attributes:
      label: 환경
      placeholder: OS / 브라우저 / 버전
  - type: dropdown
    id: severity
    attributes:
      label: 심각도
      options: [Critical, Major, Minor]